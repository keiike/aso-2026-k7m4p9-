name: Apply tested map popup fix
on:
  push:
    paths:
      - '.github/workflows/fix-map-popup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact event-handler change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('map.js')
          s=p.read_text()
          old="map.on('zoomend moveend',()=>{if(rendering)return;rendering=true;render();rendering=false;});"
          new="""map.on('zoomend',()=>{if(rendering)return;rendering=true;render();rendering=false;});
            // Panning does not change marker proximity; keep popups alive during auto-pan.
            map.on('moveend',()=>{
              const list=filtered(),inView=list.filter(p=>map.getBounds().contains(coords(p))).length;
              document.getElementById('map-status').textContent='追加候補 '+list.length+' / '+candidates.length+'か所を表示対象に設定（この地図内 '+inView+'か所）。数字の丸は近接する候補数。';
            });"""
          assert s.count(old)==1, 'Unexpected file version; no changes made'
          p.write_text(s.replace(old,new))
          PY
          node --check map.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add map.js
          git commit -m 'Keep candidate popups open when the map automatically pans'
          git push origin HEAD:main

name: Verify and publish Google map option
on:
  push:
    paths:
      - '.github/workflows/google-map-check.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - name: Check both mobile and desktop views
        run: |
          mkdir -p /tmp/google-view-test
          python - <<'PY'
          import asyncio, functools, http.server, json, pathlib, threading
          from playwright.async_api import async_playwright
          root=pathlib.Path.cwd();out=pathlib.Path('/tmp/google-view-test')
          index=root/'index.html';s=index.read_text()
          old='<script src="map.js?v=20260920-map2"></script>'
          assert s.count(old)==1 and 'google-map-view.js' not in s
          s=s.replace(old,'<script src="google-map-view.js?v=20260920-google1"></script>\n'+old)
          s=s.replace('<b>9/20更新：背景地図を国土地理院へ変更。</b>','<b>9/20更新：Googleマップ表示も選択可能。</b> 背景メニューから切り替え。Googleは地点の個別表示、ルートと全候補ピンは地理院地図で確認。')
          s=s.replace('国土地理院地図・追加候補29か所の表示切替版。','Googleマップ埋め込み追加・候補29か所表示切替版。')
          assert 'noindex,nofollow,noarchive,nosnippet' in s
          index.write_text(s)
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8765),functools.partial(http.server.SimpleHTTPRequestHandler,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          results=[]
          async def wait_for_map_image(page):
            await page.locator('.google-map-stage').scroll_into_view_if_needed()
            await page.wait_for_timeout(1500)
            fr=await (await page.query_selector('#google-map-frame')).content_frame()
            await fr.wait_for_function('Array.from(document.images).some(i => i.complete && i.naturalWidth >= 200)',timeout=25000)
            return fr
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(channel='chrome',headless=True)
              try:
                for width,height in [(390,844),(1366,900)]:
                  page=await browser.new_page(viewport={'width':width,'height':height},locale='ja-JP',timezone_id='Asia/Tokyo')
                  errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                  try:
                    await page.goto('http://127.0.0.1:8765/',wait_until='networkidle',timeout=45000)
                    await page.wait_for_selector('#map-background option[value=google]',state='attached')
                    assert await page.locator('#map').get_attribute('data-candidate-count')=='29'
                    await page.select_option('#map-background','google')
                    await page.wait_for_selector('#google-map-frame',state='visible')
                    assert await page.locator('[data-map-layer=antiques]').is_disabled()
                    fr=await wait_for_map_image(page)
                    assert 'Access blocked' not in await fr.locator('body').inner_text()
                    await page.locator('.google-map-stage').screenshot(path=str(out/f'google-area-{width}.png'))
                    await page.select_option('#map-place-select','antiques-1')
                    fr=await wait_for_map_image(page)
                    assert 'etu' in await page.locator('#google-map-frame').get_attribute('src')
                    await page.locator('.google-map-stage').screenshot(path=str(out/f'google-etu-{width}.png'))
                    await page.locator('.back-to-gsi').click()
                    assert not await page.locator('#google-map-frame').is_visible()
                    assert not await page.locator('[data-map-layer=antiques]').is_disabled()
                    await page.select_option('#map-background','std')
                    assert await page.locator('#map').get_attribute('data-candidate-count')=='29'
                    await page.select_option('#map-place-select','antiques-1')
                    await page.wait_for_timeout(400)
                    assert await page.locator('.leaflet-popup').count()==1
                    await page.locator('#map').screenshot(path=str(out/f'gsi-return-{width}.png'))
                    await page.select_option('#map-background','google')
                    await page.locator('.view-on-map').first.click()
                    assert await page.locator('#map').get_attribute('data-map-view')=='gsi'
                    assert not await page.evaluate('document.documentElement.scrollWidth>innerWidth')
                    assert not errors,errors
                    results.append({'width':width,'googleMapImageLoaded':True,'individualPlaceSelection':True,'returnToGsi':True,'candidateCount':29,'errors':errors})
                  except Exception:
                    await page.screenshot(path=str(out/f'failure-{width}.png'))
                    raise
                  finally:
                    await page.close()
              finally:
                (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
                await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-map-final-check
          path: /tmp/google-view-test/
          retention-days: 1
      - name: Publish tested page change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable Google Maps embed selector; keep GSI itinerary and candidate pins'
          git push

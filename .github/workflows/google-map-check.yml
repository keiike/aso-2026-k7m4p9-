name: Inspect Google map embed
on:
  push:
    paths:
      - '.github/workflows/google-map-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - name: Inspect browser map response
        run: |
          mkdir -p /tmp/google-embed-check
          python - <<'PY'
          import asyncio, functools, http.server, json, pathlib, threading
          from playwright.async_api import async_playwright
          root=pathlib.Path.cwd();out=pathlib.Path('/tmp/google-embed-check')
          f=root/'index.html';s=f.read_text();s=s.replace('<script src="map.js?v=20260920-map2"></script>','<script src="google-map-view.js?v=20260920-google1"></script>\n<script src="map.js?v=20260920-map2"></script>');f.write_text(s)
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8765),functools.partial(http.server.SimpleHTTPRequestHandler,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(channel='chrome',headless=True)
              page=await b.new_page(viewport={'width':390,'height':844},locale='ja-JP',timezone_id='Asia/Tokyo')
              responses=[];failures=[];errors=[]
              page.on('response',lambda r:responses.append({'url':r.url,'status':r.status}) if 'google.' in r.url or 'gstatic' in r.url else None)
              page.on('requestfailed',lambda r:failures.append({'url':r.url,'reason':r.failure}))
              page.on('pageerror',lambda e:errors.append(str(e)))
              await page.goto('http://127.0.0.1:8765/',wait_until='networkidle',timeout=45000)
              await page.wait_for_selector('#map-background option[value=google]',state='attached')
              await page.select_option('#map-background','google')
              await page.wait_for_timeout(12000)
              await page.locator('.google-map-stage').screenshot(path=str(out/'area.png'))
              frames=[]
              for i,fr in enumerate(page.frames[1:]):
                text=await fr.locator('body').inner_text(timeout=5000)
                frames.append({'url':fr.url,'body':text,'gmStyle':await fr.locator('.gm-style').count(),'images':await fr.locator('img').count()})
                (out/f'frame-{i}.html').write_text(await fr.content())
              await page.select_option('#map-place-select','antiques-1')
              await page.wait_for_timeout(10000)
              await page.locator('.google-map-stage').screenshot(path=str(out/'etu.png'))
              for fr in page.frames[1:]:
                frames.append({'url':fr.url,'body':await fr.locator('body').inner_text(timeout=5000),'gmStyle':await fr.locator('.gm-style').count(),'images':await fr.locator('img').count()})
              result={'frames':frames,'responses':responses,'failures':failures,'errors':errors}
              (out/'inspection.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
              print(json.dumps({'frames':frames,'failures':failures,'errors':errors},ensure_ascii=False))
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-embed-inspection
          path: /tmp/google-embed-check/
          retention-days: 1

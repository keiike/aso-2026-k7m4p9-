name: Map location check
on:
  push:
    paths:
      - '.github/workflows/map-location-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve remaining public place names
        shell: bash
        run: |
          mkdir -p map-check
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, time, pathlib
          out=pathlib.Path('map-check')
          queries=['白川水源','鍋ヶ滝','四月の魚','古道具るごろ','熊本県山鹿市津留2502','熊本県大津町岩坂421','熊本県熊本市中央区呉服町2丁目31番1号']
          results=[]
          for q in queries:
              url='https://msearch.gsi.go.jp/address-search/AddressSearch?'+urllib.parse.urlencode({'q':q})
              req=urllib.request.Request(url,headers={'User-Agent':'AsoTripMapLocationCheck/1.0 (+https://keiike.github.io/aso-2026-k7m4p9-/)','Referer':'https://keiike.github.io/'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r: data=json.load(r)
                  results.append({'query':q,'results':data})
              except Exception as e: results.append({'query':q,'error':str(e)})
              time.sleep(1.1)
          (out/'landmarks.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: map-landmark-check
          path: map-check/
          retention-days: 1

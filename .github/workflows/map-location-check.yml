name: Map browser check
on:
  push:
    paths:
      - '.github/workflows/map-location-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install browser test library
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          if ! command -v google-chrome >/dev/null 2>&1; then python3 -m playwright install chromium --with-deps; fi
      - name: Check the published map and category controls
        shell: bash
        run: |
          mkdir -p map-check
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import urllib.request,time,json,pathlib,shutil
          out=pathlib.Path('map-check')
          url='https://keiike.github.io/aso-2026-k7m4p9-/?v=20260920-map2'
          for i in range(40):
              try:
                  with urllib.request.urlopen(url,timeout=15) as r: html=r.read().decode()
                  if 'map.js?v=20260920-map2' in html: break
              except Exception: pass
              time.sleep(5)
          else: raise RuntimeError('Updated HTML not yet deployed')
          result={'page':url,'tiles':[],'errors':[]}
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(executable_path=shutil.which('google-chrome'),headless=True,args=['--no-sandbox'])
                  page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=1,is_mobile=True,has_touch=True)
                  page.on('pageerror',lambda e:result['errors'].append(str(e)))
                  def record(r):
                      if 'cyberjapandata.gsi.go.jp/xyz/' in r.url:
                          result['tiles'].append({'url':r.url,'status':r.status})
                  page.on('response',record)
                  page.goto(url,wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_selector('#map[data-candidate-count="29"]',timeout=45000)
                  page.wait_for_timeout(4000)
                  assert page.locator('.view-on-map').count()==29
                  assert page.locator('#map-place-select option').count()==30
                  assert 'noindex' in page.locator('meta[name="robots"]').get_attribute('content')
                  assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth')
                  page.locator('[data-map-layer="antiques"]').uncheck()
                  assert page.locator('#map').get_attribute('data-candidate-count')=='9'
                  page.locator('[data-map-layer="planned"]').uncheck()
                  assert page.locator('#map').get_attribute('data-planned-visible')=='false'
                  page.locator('#show-planned-only').click()
                  assert page.locator('#map').get_attribute('data-candidate-count')=='0'
                  page.locator('#show-all-candidates').click()
                  assert page.locator('#map').get_attribute('data-candidate-count')=='29'
                  page.locator('#map-search').fill('セカンドストリート日田店')
                  page.wait_for_timeout(250)
                  assert page.locator('#map').get_attribute('data-candidate-count')=='1'
                  page.locator('#map-place-select').select_option('antiques-1')
                  page.wait_for_timeout(1500)
                  assert page.locator('.leaflet-popup h3').inner_text()=='etu'
                  page.locator('.leaflet-popup-close-button').click()
                  page.locator('#show-all-candidates').click()
                  page.locator('#local-map').click()
                  page.wait_for_timeout(2500)
                  page.locator('#map').screenshot(path=str(out/'map-mobile.png'))
                  page.locator('#map-background').select_option('std')
                  page.wait_for_timeout(2500)
                  page.locator('#map').screenshot(path=str(out/'map-standard.png'))
                  result['candidate_count']=page.locator('#map').get_attribute('data-candidate-count')
                  result['tile_warning']=page.locator('#tile-status').is_visible()
                  result['loaded_images']=page.locator('#map img.leaflet-tile-loaded').count()
                  assert any(t['status']==200 for t in result['tiles']), 'No successful live map tiles'
                  assert not result['errors'], result['errors']
                  result['passed']=True
                  browser.close()
          finally:
              (out/'browser-results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-browser-check
          path: map-check/
          retention-days: 1

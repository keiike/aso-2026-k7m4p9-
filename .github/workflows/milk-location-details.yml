name: Finish tested milk sweets update
on:
  push:
    paths: ['.github/workflows/milk-location-details.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pyyaml
      - name: Apply reviewed changes and test stable visited controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          config=yaml.safe_load(Path('.github/workflows/milk-sweets-publish.yml').read_text())
          steps=config['jobs']['verify']['steps']
          integration=next(s['run'] for s in steps if s.get('name')=='Integrate only reviewed page changes')
          test=next(s['run'] for s in steps if s.get('name')=='Verify counts, new pins, old visits, persistence and mobile layout')
          old="shop=page.locator('#sweets .place').filter(has=page.get_by_role('heading',name=name,exact=True))"
          assert test.count(old)==1
          test=test.replace(old,"shop=page.locator('#sweets input[data-visit-key]')")
          old="expect(shop.locator('input[data-visit-key]')).to_be_checked()"
          assert test.count(old)==1
          test=test.replace(old,"assert shop.evaluate_all('(items,n)=>items.some(i=>i.dataset.visitKey===n&&i.checked)',name)")
          test=test.replace("expect(page.locator('.leaflet-popup')).to_have_count(1)","page.wait_for_timeout(300);expect(page.locator('.leaflet-popup')).to_have_count(1)")
          subprocess.run(integration,shell=True,executable='/bin/bash',check=True)
          subprocess.run(test,shell=True,executable='/bin/bash',check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milk-sweets-tested-final
          path: /tmp/milk-sweets-check/
          retention-days: 2
      - name: Publish only successful integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html google-map-view.js
          git commit -m 'Publish ten milk sweets shops with map pins and persistent visited checks'
          git push

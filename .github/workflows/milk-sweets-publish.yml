name: Verify and publish milk sweets additions
on:
  push:
    paths: ['.github/workflows/milk-sweets-publish.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Integrate only reviewed page changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          expected={'index.html':'2e0deda172ffb66466a2ca5586205cfdd0e832a2','google-map-view.js':'4a3350b2fb094ad77388d755a1bc41135b71b8eb','sweets.js':'80507a5c37b3a7a60262d86eaf6dff5f20f1ab63'}
          for name,sha in expected.items():
            b=Path(name).read_bytes()
            assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha,name+' changed since review'
          p=Path('index.html');s=p.read_text()
          anchor='<script src="sweets.js?v=20260921-sweets1"></script>'
          assert s.count(anchor)==1 and 'milk-sweets.js' not in s
          s=s.replace(anchor,anchor+'\n<script src="milk-sweets.js?v=20260921-milk1"></script>')
          s=s.replace('google-map-view.js?v=20260921-sweets1','google-map-view.js?v=20260921-milk1')
          s,n=re.subn(r'<p class="revision">.*?</p>','<p class="revision"><b>9/21更新：阿蘇のミルクスイーツ10店を追加。</b> スイーツは14候補、地図の追加候補は計46か所。牛乳の産地・牧場を確認できた範囲、営業日、入場料を各店に記載。現在地・訪問チェック・Google表示・乗馬なしの行程は維持しています。</p>',s,count=1);assert n==1
          s=s.replace('スイーツ4店追加版。','ミルクスイーツ10店追加・スイーツ14候補版。')
          assert 'noindex,nofollow,noarchive,nosnippet' in s
          p.write_text(s)
          p=Path('google-map-view.js');s=p.read_text();assert s.count('36か所の候補ピン')==1
          p.write_text(s.replace('36か所の候補ピン','全候補のピン'))
          PY
          for f in *.js; do node --check "$f"; done
      - run: python -m pip install playwright
      - name: Verify counts, new pins, old visits, persistence and mobile layout
        run: |
          mkdir -p /tmp/milk-sweets-check
          python - <<'PY'
          from pathlib import Path
          import functools,http.server,threading,json,urllib.parse
          from playwright.sync_api import sync_playwright,expect
          root=Path.cwd();out=Path('/tmp/milk-sweets-check')
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8774),functools.partial(http.server.SimpleHTTPRequestHandler,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          seed="""const k='aso-2026-k7m4p9-:visited:v1';if(!localStorage.getItem(k))localStorage.setItem(k,JSON.stringify({version:1,places:{etu:true,'kibaco（キバコ）':true}}));window.__geoCalls=0;Object.defineProperty(navigator,'geolocation',{configurable:true,value:{getCurrentPosition(){window.__geoCalls++},watchPosition(){window.__geoCalls++;return 1},clearWatch(){}}});"""
          results=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(channel='chrome',headless=True)
            try:
              for width in [390,1366]:
                context=browser.new_context(viewport={'width':width,'height':900},locale='ja-JP');context.add_init_script(seed)
                page=context.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                page.goto('http://127.0.0.1:8774/',wait_until='domcontentloaded');page.wait_for_selector('#locate-me')
                expect(page.locator('#map')).to_have_attribute('data-candidate-count','46')
                expect(page.locator('#sweets .place')).to_have_count(14)
                expect(page.locator('#sweets .view-on-map')).to_have_count(14)
                expect(page.locator('#titans .place')).to_have_count(3)
                expect(page.locator('#antique-list .place')).to_have_count(20)
                expect(page.locator('#clothing-list .place')).to_have_count(4)
                expect(page.locator('#classics-list .place')).to_have_count(5)
                assert page.evaluate("AsoVisits.has('etu')&&AsoVisits.has('kibaco（キバコ）')")
                assert page.evaluate('__geoCalls')==0
                assert 'noindex' in page.locator('meta[name=robots]').get_attribute('content')
                assert page.evaluate('ASO_GUIDE.sweets.length')==14
                assert page.evaluate('new Set(ASO_GUIDE.sweets.map(p=>p.name)).size')==14
                names=page.evaluate('ASO_GUIDE.sweets.slice(4).map(p=>p.name)')
                for i,name in enumerate(names,4):
                  page.select_option('#map-place-select','sweets-'+str(i))
                  expect(page.locator('.leaflet-popup')).to_have_count(1)
                  expect(page.locator('.leaflet-popup h3')).to_have_text(name)
                  page.locator('.leaflet-popup input[data-visit-key]').check()
                  assert page.evaluate('(n)=>AsoVisits.has(n)',name)
                  shop=page.locator('#sweets .place').filter(has=page.get_by_role('heading',name=name,exact=True))
                  expect(shop.locator('input[data-visit-key]')).to_be_checked()
                  assert page.locator('.map-pin.visit-complete').count()>0
                page.reload(wait_until='domcontentloaded');page.wait_for_selector('#locate-me')
                for name in names:assert page.evaluate('(n)=>AsoVisits.has(n)',name)
                assert page.evaluate("AsoVisits.has('etu')&&AsoVisits.has('kibaco（キバコ）')")
                page.locator('[data-map-layer=sweets]').uncheck()
                expect(page.locator('#map')).to_have_attribute('data-candidate-count','32')
                page.locator('[data-map-layer=sweets]').check()
                expect(page.locator('#map')).to_have_attribute('data-candidate-count','46')
                page.select_option('#map-place-select','sweets-4')
                expect(page.locator('.leaflet-popup')).to_have_count(1)
                expect(page.locator('.leaflet-popup h3')).to_have_text(names[0])
                page.locator('.leaflet-popup input[data-visit-key]').uncheck()
                assert not page.evaluate('(n)=>AsoVisits.has(n)',names[0])
                assert page.evaluate("AsoVisits.has('etu')")
                page.select_option('#map-background','google')
                expect(page.locator('#google-map-frame')).to_be_visible()
                page.select_option('#map-place-select','sweets-7')
                assert names[3] in urllib.parse.unquote_plus(page.locator('#google-map-frame').get_attribute('src'))
                expect(page.locator('.google-visit-check input')).to_be_checked()
                page.locator('#sweets .view-on-map').first.click()
                expect(page.locator('#map')).to_have_attribute('data-map-view','gsi')
                expect(page.locator('.leaflet-popup')).to_have_count(1)
                expect(page.locator('.leaflet-popup h3')).to_have_text(names[0])
                page.locator('#sweets-search').fill('プリン')
                assert page.locator('#sweets .place:visible').count()>0
                page.locator('#sweets-search').fill('')
                page.locator('#open-sweets').click()
                expect(page.locator('#sweets .place:visible')).to_have_count(14)
                page.locator('#map').scroll_into_view_if_needed();page.wait_for_timeout(800)
                page.locator('#map').screenshot(path=str(out/f'map-{width}.png'))
                page.locator('#sweets .sweets-group').first.screenshot(path=str(out/f'milk-shops-{width}.png'))
                assert not page.evaluate('document.documentElement.scrollWidth>innerWidth')
                assert page.evaluate('__geoCalls')==0
                assert not errors,errors
                results.append({'width':width,'sweets':14,'candidates':46,'newPins':10,'preservedOldVisits':True,'savedNewVisits':True,'googleSelection':True,'categoryToggle':True,'locationNeverRequested':True,'horizontalOverflow':False,'errors':errors})
                context.close()
            finally:
              (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2));browser.close();server.shutdown()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milk-sweets-browser-check
          path: /tmp/milk-sweets-check/
          retention-days: 2
      - name: Publish only verified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html google-map-view.js
          git commit -m 'Publish ten milk sweets candidates; preserve current map and visited state'
          git push

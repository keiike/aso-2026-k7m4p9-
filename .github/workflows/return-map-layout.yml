name: Check return-map layout
on:
  push:
    paths:
      - '.github/workflows/return-map-layout.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Keep route endpoints away from zoom controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('return-map.js');s=p.read_text();old='padding:[32,32], maxZoom, animate:false';assert s.count(old)==1
          s=s.replace(old,'paddingTopLeft:[30,85], paddingBottomRight:[30,30], maxZoom, animate:false').replace("'20260922-map1'","'20260922-map2'");p.write_text(s)
          p=Path('index.html');s=p.read_text();old='return-map.js?v=20260922-returnmap1';assert s.count(old)==1;p.write_text(s.replace(old,'return-map.js?v=20260922-returnmap2'))
          PY
          node --check return-map.js
      - name: Install browser and Japanese fonts for rendering checks
        run: |
          python -m pip install playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: Check rendering and live route selection
        run: |
          mkdir -p /tmp/return-map-layout
          python - <<'PY'
          from pathlib import Path
          import functools,http.server,threading,json
          from playwright.sync_api import sync_playwright,expect
          out=Path('/tmp/return-map-layout')
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8778),functools.partial(http.server.SimpleHTTPRequestHandler,directory=str(Path.cwd())))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          results=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(channel='chrome',headless=True)
            try:
              for width in [390,1366]:
                context=browser.new_context(viewport={'width':width,'height':900},locale='ja-JP')
                context.add_init_script("window.__geoCalls=0;Object.defineProperty(navigator,'geolocation',{value:{getCurrentPosition(){__geoCalls++},watchPosition(){__geoCalls++;return 1},clearWatch(){}}})")
                page=context.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                page.goto('http://127.0.0.1:8778/',wait_until='domcontentloaded');page.wait_for_selector('#rc-show-route')
                expect(page.locator('.return-pin')).to_have_count(9)
                page.locator('#fit-return-local').click();page.wait_for_timeout(1200)
                page.locator('#map').screenshot(path=str(out/f'local-{width}.png'))
                page.locator('#return-map-note').screenshot(path=str(out/f'controls-{width}.png'))
                page.locator('#fit-return-city').click();page.wait_for_timeout(800)
                boxes=page.evaluate("AsoTripMap.planned.getLayers().filter(x=>['hails','Anvin.store'].includes(x.options.returnStopName)).map(x=>{const p=AsoTripMap.map.latLngToContainerPoint(x.getLatLng());return {name:x.options.returnStopName,x:p.x,y:p.y}})")
                for box in boxes:assert box['x']>60 or box['y']>80,box
                page.locator('#map').screenshot(path=str(out/f'city-{width}.png'))
                page.locator('#rc-shop-options input[data-visit-key="hails"]').check()
                page.wait_for_function("JSON.parse(document.getElementById('map').dataset.returnShops).join(',')==='Anvin.store'")
                expect(page.locator('.return-pin')).to_have_count(8)
                page.reload(wait_until='domcontentloaded');page.wait_for_selector('#rc-show-route')
                assert page.evaluate("AsoVisits.has('hails')")
                expect(page.locator('.return-pin')).to_have_count(8)
                page.locator('input[data-course-pick="Grandma ATQ"]').check()
                page.wait_for_function("JSON.parse(document.getElementById('map').dataset.returnShops).join(',')==='Grandma ATQ,Anvin.store'")
                expect(page.locator('.return-pin')).to_have_count(9)
                assert 'noindex' in page.locator('meta[name=robots]').get_attribute('content')
                assert page.evaluate('__geoCalls')==0
                assert not page.evaluate('document.documentElement.scrollWidth>innerWidth')
                assert not errors,errors
                results.append({'width':width,'JapaneseFontCheck':True,'clearRouteEndpoints':boxes,'visitsPreserved':True,'selectionSync':True,'errors':errors})
                context.close()
            finally:
              (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2));browser.close();server.shutdown()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-map-final-layout
          path: /tmp/return-map-layout/
          retention-days: 1
      - name: Publish tested layout adjustment
        run: |
          git config user.name 'keiike'
          git config user.email '58475682+keiike@users.noreply.github.com'
          git add index.html return-map.js
          git commit -m 'Keep return-route endpoints clear of map controls on mobile'
          git push origin HEAD:main

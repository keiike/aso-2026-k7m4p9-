name: Finish verified roadside station update
on:
  push:
    paths:
      - '.github/workflows/roadstation-references.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pyyaml
      - name: Apply reviewed integration and verify full text filtering
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          source=yaml.safe_load(Path('.github/workflows/roadstations-publish.yml').read_text())
          steps=source['jobs']['verify']['steps']
          integration=next(s['run'] for s in steps if s.get('name')=='Integrate reviewed additions')
          subprocess.run(['bash','-e','-c',integration],check=True)
          test=next(s['run'] for s in steps if s.get('name')=='Test maps, station filters and visited persistence')
          old="expect(page.locator('#roadstations .place:visible')).to_have_count(1)"
          assert test.count(old)==1
          new="expect(page.locator('#roadstations .place:visible')).to_have_count(2)\n      assert page.locator('#roadstations .place:visible').evaluate_all(\"nodes=>nodes.every(n=>n.textContent.includes('メロン'))\")"
          test=test.replace(old,new)
          subprocess.run(['bash','-e','-c',test],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadside-stations-tested
          path: /tmp/roadstations-check/
          retention-days: 2
      - name: Publish only tested changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html map.js visited.js google-map-view.js
          git commit -m 'Enable roadside-station category, visited checks and Milk Road guidance'
          git push

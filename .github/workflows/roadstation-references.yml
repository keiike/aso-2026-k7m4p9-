name: Read official roadside-station references
on:
  push:
    paths:
      - '.github/workflows/roadstation-references.yml'
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read official location references
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re,html,json,concurrent.futures
          root='https://www.qsr.mlit.go.jp/n-michi/michi_no_eki/kobetu/'
          urls={
            'aso':root+'aso/aso.html',
            'kugino':root+'asobounosato/asobounosato.html',
            'oguni':root+'oguni/oguni.html',
            'namino':root+'namino/namino.html',
            'ozu':root+'ozu/ozu.html',
            'kyokushi':root+'kyokushi/kyokushi.html',
            'shichijo':root+'shichijyo/shichijyo.html',
            'kamoto':root+'mizubeplazakamoto/kamoto.html',
            'kamitsue':root+'kamitsue/kamitsue.html',
            'oyama':root+'oyama/oyama.html',
            'ukiha':'https://michinoeki-ukiha.com/',
            'harazuru':'https://fs-basaro.jp/',
            'kurume':'https://www.michinoeki-kurume.com/access/'
          }
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; TripReferenceCheck/1.0)'}),timeout=20) as r:
              b=r.read();text=b.decode('utf-8',errors='replace');return r.url,text
          def read(item):
            key,url=item
            try:
              final,text=get(url)
              refs=[]
              for x in re.findall(r'(?:href|src|data-src)=[\"\']([^\"\']+)',text):
                x=html.unescape(x)
                if any(a in x for a in ['google.com/maps','google.co.jp/maps','maps.google','maps.app.goo.gl','goo.gl/maps']):
                  if x not in refs:refs.append(x)
              resolved=[]
              for link in refs[:3]:
                if 'maps.app.goo.gl' in link or 'goo.gl/maps' in link:
                  try:
                    dest,_=get(link);resolved.append(dest)
                  except Exception:pass
              plain=html.unescape(re.sub('<[^>]+>',' ',text))
              plain=re.sub(r'\s+',' ',plain)
              snippets=[plain[max(0,m.start()-30):m.start()+180] for m in re.finditer('営業時間|休館日|休業日',plain)][:4]
              return {'id':key,'source':url,'maps':refs[:5],'resolved':resolved,'hours':snippets}
            except Exception as e:return {'id':key,'source':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            for result in pool.map(read,urls.items()):print('STATION '+json.dumps(result,ensure_ascii=False))
          PY

name: Verify and publish sweets candidates
on:
  push:
    paths:
      - '.github/workflows/sweets-publish.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Integrate reviewed changes without replacing existing content
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          expected={'index.html':'84b800812530afe2ac338481074f2fe4f5a8a38c','map.js':'99180add3c6b75fd15f8181810d58f9742ce4f8f','visited.js':'0c51dc8460cbe10ad506c642cea75828a9058765','google-map-view.js':'d7ed682b6e9a892aac41745a3899985bc23b23a8'}
          for name,sha in expected.items():
            b=Path(name).read_bytes()
            assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha,name+' changed since review'
          def replace(name,old,new):
            p=Path(name);s=p.read_text();assert s.count(old)==1,(name,old,s.count(old));p.write_text(s.replace(old,new))
          replace('map.js','    ...(window.ASO_HITA_GEO || []),','    ...(window.ASO_HITA_GEO || []),\n    ...(window.ASO_SWEETS_GEO || []),')
          replace('map.js',"    titans: {name:'進撃の日田', short:'進', color:'#985149'}","    titans: {name:'進撃の日田', short:'進', color:'#985149'},\n    sweets: {name:'ソフト・スイーツ', short:'甘', color:'#a34d6c'}")
          replace('map.js',"classics:true,titans:true,query:''","classics:true,titans:true,sweets:true,query:''")
          replace('visited.js',"['clothing','antiques','classics','titans']","['clothing','antiques','classics','titans','sweets']")
          replace('google-map-view.js',"['clothing', 'antiques', 'classics', 'titans']","['clothing', 'antiques', 'classics', 'titans', 'sweets']")
          replace('google-map-view.js','32か所','36か所')
          replace('index.html','<script src="hita-spots.js?v=20260920-v4"></script>','<script src="hita-spots.js?v=20260920-v4"></script>\n<script src="sweets.js?v=20260921-sweets1"></script>')
          for name in ['map.js','visited.js','google-map-view.js']:
            replace('index.html',name+'?v=20260920-v4',name+'?v=20260921-sweets1')
          p=Path('index.html');s=p.read_text()
          s,n=re.subn(r'<p class="revision">.*?</p>','<p class="revision"><b>9/21更新：ソフトクリーム・スイーツ4店を追加。</b> 地図の「甘」ピン・店舗一覧・訪問済みチェックで確認できます。現在地表示、Googleマップ切替、進撃の日田、乗馬なしの行程は維持。追加候補36か所は必須の立ち寄り先ではありません。</p>',s,count=1);assert n==1
          s=s.replace('四角い「衣・古・観」','四角い「衣・古・観・進・甘」')
          s=s.replace('更新：2026-09-20／現在地・訪問チェック・進撃の日田3か所追加版。','更新：2026-09-21／現在地・訪問チェック・進撃の日田・スイーツ4店追加版。')
          assert 'noindex,nofollow,noarchive,nosnippet' in s
          p.write_text(s)
          PY
          for f in *.js; do node --check "$f"; done
      - run: python -m pip install playwright
      - name: Test four candidates and preserve old visited data on mobile and desktop
        run: |
          mkdir -p /tmp/sweets-check
          python - <<'PY'
          from pathlib import Path
          import functools,http.server,threading,json
          from playwright.sync_api import sync_playwright,expect
          root=Path.cwd();out=Path('/tmp/sweets-check')
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8772),functools.partial(http.server.SimpleHTTPRequestHandler,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          seed="""const k='aso-2026-k7m4p9-:visited:v1';if(!localStorage.getItem(k))localStorage.setItem(k,JSON.stringify({version:1,places:{etu:true}}));window.__geoCalls=0;Object.defineProperty(navigator,'geolocation',{configurable:true,value:{getCurrentPosition(){window.__geoCalls++},watchPosition(){window.__geoCalls++;return 1},clearWatch(){}}});"""
          results=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(channel='chrome',headless=True)
            try:
              for width in [390,1366]:
                context=browser.new_context(viewport={'width':width,'height':900},locale='ja-JP');context.add_init_script(seed)
                page=context.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                page.goto('http://127.0.0.1:8772/',wait_until='domcontentloaded')
                page.wait_for_selector('#locate-me')
                expect(page.locator('#map')).to_have_attribute('data-candidate-count','36')
                expect(page.locator('#sweets .place')).to_have_count(4)
                expect(page.locator('#sweets .view-on-map')).to_have_count(4)
                expect(page.locator('#titans .place')).to_have_count(3)
                expect(page.locator('#antique-list .place')).to_have_count(20)
                expect(page.locator('#clothing-list .place')).to_have_count(4)
                assert page.evaluate("AsoVisits.has('etu')")
                assert page.evaluate('__geoCalls')==0
                assert 'noindex' in page.locator('meta[name=robots]').get_attribute('content')
                names=page.evaluate('ASO_GUIDE.sweets.map(p=>p.name)')
                for i,name in enumerate(names):
                  page.select_option('#map-place-select','sweets-'+str(i))
                  expect(page.locator('.leaflet-popup h3')).to_have_text(name)
                  page.locator('.leaflet-popup input[data-visit-key]').check()
                  assert page.evaluate('(n)=>AsoVisits.has(n)',name)
                  assert page.locator('#sweets .place').nth(i).locator('input[data-visit-key]').is_checked()
                  assert page.locator('.map-pin.visit-complete').count()>0
                  expect(page.locator('.leaflet-popup h3')).to_have_text(name)
                page.reload(wait_until='domcontentloaded');page.wait_for_selector('#locate-me')
                for name in names:assert page.evaluate('(n)=>AsoVisits.has(n)',name)
                assert page.evaluate("AsoVisits.has('etu')")
                page.locator('[data-map-layer=sweets]').uncheck()
                expect(page.locator('#map')).to_have_attribute('data-candidate-count','32')
                page.locator('[data-map-layer=sweets]').check()
                expect(page.locator('#map')).to_have_attribute('data-candidate-count','36')
                page.select_option('#map-place-select','sweets-0')
                expect(page.locator('.leaflet-popup h3')).to_have_text(names[0])
                page.locator('.leaflet-popup input[data-visit-key]').uncheck()
                assert not page.evaluate('(n)=>AsoVisits.has(n)',names[0])
                assert page.evaluate("AsoVisits.has('etu')")
                page.select_option('#map-background','google')
                expect(page.locator('#google-map-frame')).to_be_visible()
                page.select_option('#map-place-select','sweets-1')
                query=page.locator('#google-map-frame').get_attribute('src')
                assert '%E3%81%A4%E3%81%84%E3%82%93' in query
                expect(page.locator('.google-visit-check input')).to_be_checked()
                page.locator('#sweets .view-on-map').first.click()
                expect(page.locator('#map')).to_have_attribute('data-map-view','gsi')
                expect(page.locator('.leaflet-popup h3')).to_have_text(names[0])
                page.locator('#map').scroll_into_view_if_needed();page.wait_for_timeout(1000)
                page.locator('#map').screenshot(path=str(out/f'map-{width}.png'))
                page.locator('#sweets').screenshot(path=str(out/f'sweets-{width}.png'))
                assert not page.evaluate('document.documentElement.scrollWidth>innerWidth')
                assert page.evaluate('__geoCalls')==0
                assert not errors,errors
                results.append({'width':width,'sweets':4,'candidates':36,'preservedOldVisits':True,'fourCheckboxesSaved':True,'mapPinsChanged':True,'categoryToggle':True,'googleSelection':True,'locationNotRequested':True,'errors':errors})
                context.close()
            finally:
              (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2));browser.close();server.shutdown()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweets-browser-check
          path: /tmp/sweets-check/
          retention-days: 1
      - name: Publish only tested integrations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html map.js visited.js google-map-view.js
          git commit -m 'Show four sweets candidates on map and retain visited checks and location controls'
          git push

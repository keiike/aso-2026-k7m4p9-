name: Complete verified sweets update
on:
  push:
    paths:
      - '.github/workflows/sweets-reference-check.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pyyaml
      - name: Integrate and run the complete suite with popup-transition waits
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          spec=yaml.safe_load(Path('.github/workflows/sweets-publish.yml').read_text())
          steps=spec['jobs']['verify']['steps']
          subprocess.run(steps[1]['run'],shell=True,executable='/bin/bash',check=True)
          test=steps[3]['run']
          old="expect(page.locator('.leaflet-popup h3')).to_have_text(name)"
          new="page.wait_for_function(\"n=>{const h=document.querySelectorAll('.leaflet-popup h3');return h.length===1 && h[0].textContent===n}\",arg=name)"
          assert test.count(old)==2
          test=test.replace(old,new)
          old="expect(page.locator('.leaflet-popup h3')).to_have_text(names[0])"
          new="page.wait_for_function(\"n=>{const h=document.querySelectorAll('.leaflet-popup h3');return h.length===1 && h[0].textContent===n}\",arg=names[0])"
          assert test.count(old)==2
          test=test.replace(old,new)
          subprocess.run(test,shell=True,executable='/bin/bash',check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweets-browser-final-check
          path: /tmp/sweets-check/
          retention-days: 1
      - name: Publish tested changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html map.js visited.js google-map-view.js
          git commit -m 'Add four sweets candidates with map filters, Google selection and persistent visit checks'
          git push

name: Verify and publish trip tools
on:
  push:
    paths:
      - '.github/workflows/trip-features-check.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Integrate features without replacing existing guide content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text()
          assert 'visited.js' not in s and 'current-location.js' not in s
          s=s.replace('<script src="guide.js?v=20260920-1"></script>','<script src="guide.js?v=20260920-1"></script>\n<script src="hita-spots.js?v=20260920-v4"></script>')
          s=s.replace('<script src="google-map-view.js?v=20260920-google1"></script>','<script src="google-map-view.js?v=20260920-v4"></script>\n<script src="visited.js?v=20260920-v4"></script>\n<script src="current-location.js?v=20260920-v4"></script>')
          s=s.replace('map.js?v=20260920-map2','map.js?v=20260920-v4')
          s=re.sub(r'<p class="revision">.*?</p>','<p class="revision"><b>9/20更新：現在地・訪問済みチェック・進撃の日田を追加。</b> 訪問チェックはこのブラウザに保存し、地理院地図のピンに反映します。現在地は許可したときだけ取得。Google表示と乗馬なしの行程は維持。追加候補32か所は必須の立ち寄り先ではありません。</p>',s,count=1)
          s=s.replace('Googleマップ埋め込み追加・候補29か所表示切替版。','現在地・訪問チェック・進撃の日田3か所追加版。')
          assert 'noindex,nofollow,noarchive,nosnippet' in s
          assert all(n in s for n in ['hita-spots.js','visited.js','current-location.js'])
          p.write_text(s)
          p=Path('google-map-view.js');s=p.read_text().replace("['clothing', 'antiques', 'classics']","['clothing', 'antiques', 'classics', 'titans']").replace('29か所','32か所').replace("['local-map','miyaji-map','wide-map']","['local-map','miyaji-map','wide-map','hita-map']");p.write_text(s)
          p=Path('visited.js');s=p.read_text().replace('try { next = read(); }','try { if (storageOk) next = read(); }');p.write_text(s)
          p=Path('map.js');s=p.read_text()
          def once(a,b):
            global s
            assert s.count(a)==1,(a,s.count(a))
            s=s.replace(a,b)
          once('/* Map update 2026-09-20. No online geocoding, location tracking, or route recalculation. */','/* Map 2026-09-20. Optional device location and manual visits use separate modules. */')
          once('  const raw = [','  const raw = [\n    ...(window.ASO_HITA_GEO || []),')
          once("classics: {name:'追加の観光', short:'観', color:'#946717'}","classics: {name:'追加の観光', short:'観', color:'#946717'},\n    titans: {name:'進撃の日田', short:'進', color:'#985149'}")
          once("classics:true,query:''","classics:true,titans:true,query:''")
          once('<button id="wide-map" type="button">福岡〜熊本の全体</button>','<button id="wide-map" type="button">福岡〜熊本の全体</button><button id="hita-map" type="button">日田・進撃を拡大</button>')
          once("  const dayColors=['#b8612f','#2b7655','#37739d'];","""  const visits=window.AsoVisits;
            const visitGroups={nakasu:['トヨタレンタカー中洲店'],hita:['セカンドストリート日田店'],kuro:['Au Pan & Coffee','Patisserie ROKU 麓','黒川温泉'],daikan:['大観峰'],base:['村田家旅館'],kusa:['草千里ヶ浜','阿蘇火山博物館'],yone:['米塚'],miyaji:['阿蘇神社・門前町','komeko','TOMMY’Sアンティーク＆ステンドグラス','森本金物店・阿蘇昭和レトロ雑貨','etu','みやがわ時計店'],meru:['めるころ パン工房'],mochi:['もちとこ'],milk:['ミルクロード']};
            const dayColors=['#b8612f','#2b7655','#37739d'];""")
          once("    L.marker(p.slice(0,2),{pane:'tripStops'","""    if(visits){const group=document.createElement('div');group.className='visit-popup-stops';for(const name of visitGroups[key]||[]){const row=document.createElement('div');row.className='visit-stop';const title=document.createElement('span');title.textContent=name;row.append(title,visits.control(name));group.append(row);}box.append(group);}
              const routeMarker=L.marker(p.slice(0,2),{pane:'tripStops'""")
          once("}).addTo(planned).bindTooltip(p[2]).bindPopup(box);","}).addTo(planned).bindTooltip(p[2]).bindPopup(box);\n    visits?.bindMarker(routeMarker,visitGroups[key]||[]);")
          once('    box.appendChild(links);return box;','    box.appendChild(links);if(visits)box.append(visits.control(p.name));return box;')
          once("    return L.marker(coords(p),{pane,title:p.name","    const marker=L.marker(coords(p),{pane,title:p.name")
          once('.bindPopup(popup(p),{maxWidth:290,maxHeight:330});','.bindPopup(popup(p),{maxWidth:290,maxHeight:330});\n    visits?.bindMarker(marker,[p.name]);return marker;')
          once('button.onclick=()=>showFocus(p.id,false);listBox.appendChild(button);',"button.dataset.visitLabel=p.name;button.onclick=()=>showFocus(p.id,false);const entry=document.createElement('div');entry.className='cluster-entry';entry.append(button);if(visits)entry.append(visits.control(p.name));listBox.append(entry);")
          once("      L.marker(center,{pane:'candidatePins'","      const clusterMarker=L.marker(center,{pane:'candidatePins'")
          once(".bindTooltip('タップして候補を選ぶ');",".bindTooltip('タップして候補を選ぶ');\n      visits?.bindMarker(clusterMarker,g.items.map(p=>p.name),true);")
          once('    host.dataset.candidateCount=String(list.length);host.dataset.plannedVisible=String(state.planned);','    host.dataset.candidateCount=String(list.length);host.dataset.plannedVisible=String(state.planned);\n    visits?.refresh();')
          once("  document.getElementById('miyaji-map').onclick=","  document.getElementById('hita-map').onclick=()=>fitLocations(available.filter(p=>p.category==='titans').map(coords),13);\n  document.getElementById('miyaji-map').onclick=")
          p.write_text(s)
          PY
          for f in *.js; do node --check "$f"; done
      - run: python -m pip install playwright
      - name: Check mobile, desktop, location errors and persistence
        run: |
          mkdir -p /tmp/trip-check
          python - <<'PY'
          import functools,http.server,threading,pathlib,json
          from playwright.sync_api import sync_playwright
          root=pathlib.Path.cwd();out=pathlib.Path('/tmp/trip-check')
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8771),functools.partial(http.server.SimpleHTTPRequestHandler,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          mock="""window.__geo={calls:0,active:0,mode:'ok',pending:[],clears:0};
          const geo=window.__geo,pos=()=>({coords:{latitude:33.3168,longitude:130.9383166,accuracy:20},timestamp:Date.now()});
          Object.defineProperty(navigator,'geolocation',{configurable:true,value:{
          getCurrentPosition(ok,err){geo.calls++;if(geo.mode==='hold'){geo.pending.push(ok);return;}setTimeout(()=>geo.mode==='ok'?ok(pos()):err({code:Number(geo.mode)}),30)},
          watchPosition(ok,err){geo.calls++;geo.active=1;setTimeout(()=>geo.mode==='ok'?ok(pos()):err({code:Number(geo.mode)}),30);return 7},
          clearWatch(){geo.active=0;geo.clears++}}});"""
          results=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(channel='chrome',headless=True)
            try:
              for width in [390,1366]:
                context=browser.new_context(viewport={'width':width,'height':844 if width==390 else 920},locale='ja-JP')
                context.add_init_script(mock)
                page=context.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                page.goto('http://127.0.0.1:8771/',wait_until='domcontentloaded');page.wait_for_selector('#locate-me')
                assert page.evaluate('__geo.calls')==0
                assert page.locator('#map').get_attribute('data-candidate-count')=='32'
                assert page.locator('#titans .place').count()==3
                assert 'noindex' in page.locator('meta[name=robots]').get_attribute('content')
                page.select_option('#map-place-select','antiques-1');page.wait_for_selector('.leaflet-popup')
                page.locator('.leaflet-popup input[data-visit-key="etu"]').check()
                assert page.locator('.map-pin.visit-complete').count()>0
                assert page.locator('.leaflet-popup').count()==1
                page.reload(wait_until='domcontentloaded');page.wait_for_selector('#locate-me');page.select_option('#map-place-select','antiques-1');page.wait_for_selector('.leaflet-popup')
                assert page.locator('.leaflet-popup input[data-visit-key="etu"]').is_checked()
                page.locator('.leaflet-popup input[data-visit-key="etu"]').uncheck()
                assert page.locator('.map-pin.visit-complete').count()==0
                page.evaluate("AsoVisits.set('草千里ヶ浜',true)")
                assert page.locator('.route-pin.visit-partial').count()>0
                page.select_option('#map-place-select','titans-0');page.wait_for_selector('.leaflet-popup')
                page.locator('.leaflet-popup input[data-visit-key]').check()
                assert page.locator('.map-pin.visit-complete').count()>0
                page.locator('#hita-map').click()
                page.locator('#locate-me').click();page.wait_for_selector('.geo-location-marker')
                assert '20 m' in page.locator('#location-status').inner_text()
                assert page.locator('.geo-accuracy-circle').count()==1
                assert page.evaluate('__geo.calls')==1
                assert '33.3168' not in page.evaluate('JSON.stringify(localStorage)')
                page.locator('#location-auto').check();page.wait_for_timeout(100)
                assert page.evaluate('__geo.active')==1
                page.locator('#location-auto').uncheck();assert page.evaluate('__geo.active')==0
                page.select_option('#map-background','google')
                assert page.locator('#google-map-frame').is_visible()
                page.select_option('#map-place-select','titans-0')
                assert page.locator('.google-visit-check input').is_checked()
                page.locator('#locate-me').click();page.wait_for_timeout(150)
                assert page.locator('#map').get_attribute('data-map-view')=='gsi'
                page.evaluate('__geo.mode="1"');page.locator('#locate-me').click();page.wait_for_timeout(100)
                assert '許可されていません' in page.locator('#location-status').inner_text()
                assert page.locator('.geo-location-marker.is-stale').count()==1
                page.locator('#clear-location').click();assert page.locator('.geo-location-marker').count()==0
                page.evaluate('__geo.mode="3"');page.locator('#locate-me').click();page.wait_for_timeout(100)
                assert '時間内' in page.locator('#location-status').inner_text()
                page.evaluate('__geo.mode="hold"');page.locator('#locate-me').click();page.locator('#clear-location').click()
                page.evaluate('__geo.pending[0]({coords:{latitude:33,longitude:131,accuracy:10},timestamp:Date.now()})')
                assert page.locator('.geo-location-marker').count()==0
                page.evaluate('__geo.mode="ok"');page.locator('#location-auto').check();page.wait_for_timeout(100)
                page.evaluate("Object.defineProperty(document,'hidden',{configurable:true,value:true});document.dispatchEvent(new Event('visibilitychange'))")
                assert page.evaluate('__geo.active')==0
                page.evaluate("Object.defineProperty(document,'hidden',{configurable:true,value:false})")
                assert not page.locator('#location-auto').is_checked()
                page.locator('#hita-map').click();page.locator('#map').scroll_into_view_if_needed();page.wait_for_timeout(1000)
                page.screenshot(path=str(out/f'map-{width}.png'))
                assert not page.evaluate('document.documentElement.scrollWidth>innerWidth')
                assert not errors,errors
                results.append({'width':width,'candidates':32,'photoSpots':3,'visitReload':True,'markerChanged':True,'mockLocationAndErrors':True,'googleSwitch':True,'errors':errors})
                context.close()
              # Blocked persistent storage retains multiple marks within the tab.
              context=browser.new_context();context.add_init_script("Storage.prototype.setItem=function(){throw new DOMException('Blocked','SecurityError')}")
              page=context.new_page();page.goto('http://127.0.0.1:8771/',wait_until='domcontentloaded');page.wait_for_selector('#visit-summary')
              page.evaluate("AsoVisits.set('etu',true);AsoVisits.set('米塚',true)")
              assert page.evaluate("AsoVisits.has('etu')&&AsoVisits.has('米塚')")
              assert '保存できない' in page.locator('#visit-storage-status').inner_text()
              context.close()
            finally:
              (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
              browser.close();server.shutdown()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trip-tools-browser-check
          path: /tmp/trip-check/
          retention-days: 1
      - name: Publish only when all checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html map.js google-map-view.js visited.js
          git commit -m 'Enable tested current location, visited markers and three Hita photo spots'
          git push

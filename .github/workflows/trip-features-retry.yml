name: Finish verified trip tools
on:
  push:
    paths:
      - '.github/workflows/trip-features-retry.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pyyaml
      - name: Apply integration and check the selected popup rather than the previous popup
        run: |
          python - <<'PY'
          import pathlib,subprocess,yaml
          doc=yaml.safe_load(pathlib.Path('.github/workflows/trip-features-check.yml').read_text())
          steps=doc['jobs']['verify']['steps']
          integrate=next(s['run'] for s in steps if s.get('name','').startswith('Integrate features'))
          subprocess.run(['bash','-e','-c',integrate],check=True)
          p=pathlib.Path('map.js');s=p.read_text()
          old='const p=byId.get(id);if(!p)return;'
          assert s.count(old)==1
          p.write_text(s.replace(old,old+'map.closePopup();'))
          check=next(s['run'] for s in steps if s.get('name','').startswith('Check mobile'))
          old="page.locator('.leaflet-popup input[data-visit-key]').check()"
          new="page.locator('.leaflet-popup input[data-visit-key=\"リヴァイ兵士長像（日田駅南広場）\"]').check()"
          assert check.count(old)==1
          check=check.replace(old,new)
          subprocess.run(['bash','-e','-c',check],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trip-tools-final-check
          path: /tmp/trip-check/
          retention-days: 1
      - name: Publish tested integrations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html map.js google-map-view.js visited.js
          git commit -m 'Enable current location, visited checks and Hita photo spots after browser tests'
          git push
